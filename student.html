<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Dashboard | SmartBus</title>

<link rel="stylesheet" href="dashboard.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

</head>

<body>

<header>

    <h1>🚌 SmartBus</h1>

    <button id="logoutBtn">Logout</button>

</header>

<div class="dashboard">

    <div class="card">

        <h2>🟢 Bus Status</h2>

        <p id="status">Waiting...</p>

    </div>

    <div class="card">

        <h2>📍 Distance from Bus</h2>

        <p id="distance">Calculating...</p>

    </div>

    <div class="card">

        <h2>⏱ Estimated Arrival</h2>

        <p id="eta">Calculating...</p>

    </div>

    <div class="card">

        <h2>🚌 Bus Location</h2>

        <p id="location">Waiting for Bus...</p>

    </div>

</div>

<section class="map">

    <h2>🗺 Live Bus Tracking</h2>

    <div id="map"></div>

</section>

<!-- Loading Popup -->

<div id="loadingPopup" class="loading-popup">

    <div class="loading-box">

        <div class="loader"></div>

        <h2 id="popupTitle">
            📍 Getting Your Location
        </h2>

        <p id="popupMessage">
            Please wait while we detect your current location...
        </p>

    </div>

</div>

<footer>

    <p>
        © 2026 SmartBus | Real-Time Bus Tracking System
    </p>

</footer>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module" src="student.js"></script>

</body>

</html>
