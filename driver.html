<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Driver Dashboard | SmartBus</title>

<link rel="stylesheet" href="dashboard.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header>

    <h1>🚌 Driver Dashboard</h1>

    <button id="logoutBtn">Logout</button>

</header>

<div class="dashboard">

    <div class="card">

        <h2>Trip Status</h2>

        <p id="tripStatus">🔴 Not Started</p>

    </div>

    <div class="card">

        <h2>Current Location</h2>

        <p id="driverLocation">Waiting for GPS...</p>

    </div>

</div>

<div class="dashboard">

    <div class="card">

        <h2>Driver Controls</h2>

        <button id="startTrip">▶ Start Trip</button>

        <br><br>

        <button id="stopTrip">⏹ Stop Trip</button>

    </div>

</div>

<!-- Location Popup -->

<div id="locationPopup" class="popup">

    <div class="popup-content">

        <h2 id="popupTitle">📍 Location Required</h2>

        <p id="popupMessage">
            Please enable location.
        </p>

        <button id="popupOk">
            OK
        </button>

    </div>

</div>

<script type="module" src="driver.js"></script>

</body>

</html>
